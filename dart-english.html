<title>Dart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0c;--sb:#131210;--card:#1c1b18;--ch:#232118;--bdr:#2e2b26;
  --t1:#f0ebe3;--t2:#7a7169;--t3:#3e3b37;
  --acc:#c8a97e;--acc-hover:#a0855a;
  --sw:240px;--pw:320px;--bh:0px;
  --radius:12px;
}
body.light{
  --bg:#f2ede5;--sb:#e8e3da;--card:#ddd8ce;--ch:#d4cfc5;--bdr:#c5bfb4;
  --t1:#1a1714;--t2:#7a7169;--t3:#b0a898;
  --acc:#8b6e4e;--acc-hover:#6b5035;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px}

/* overlay (standalone: fyld hele vinduet) */
.dz-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:50;animation:dzIn .18s ease}
@keyframes dzIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;z-index:8000}
.modal-box{background:var(--card);border:1px solid var(--bdr);border-radius:8px;
  padding:28px;width:380px;max-width:90vw}
.modal-title{font-size:16px;font-weight:500;margin-bottom:18px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* toasts */
.toasts{position:fixed;bottom:12px;right:16px;
  z-index:9000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--bdr);border-radius:4px;
  padding:9px 16px;font-size:13px;animation:tin .2s ease;pointer-events:auto}
@keyframes tin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

/* ── DART CSS (uddraget fra jukebox.html) ── */
/* ── DART-APP ── */
#dart-ov{padding:0;overflow:hidden;--dart-bg-grad:radial-gradient(circle at 50% 0%,rgba(217,169,28,.05),transparent 40%);--dart-card-bg:var(--card);--dart-card-border:var(--bdr);--dart-active-glow:rgba(217,169,28,.3);--dart-num-bg:var(--card);--dart-num-border:var(--bdr);--dart-finish-grad:linear-gradient(145deg,#b67832,#d29343 58%,#77451d);--dart-pattern:none}
/* Tema-swatch i setup-vælgeren */
.dart-theme-pills{flex-wrap:wrap}
/* Game-mode pills: store kort med emoji + body */
#dart-mode-pills{display:flex;flex-direction:column;gap:8px;width:100%}
.dart-mode-pill{display:flex!important;align-items:center;gap:14px;padding:12px 16px!important;text-align:left;width:100%;border-radius:12px!important;font-weight:500}
.dart-mode-emoji{font-size:28px;flex-shrink:0}
.dart-mode-body{display:flex;flex-direction:column;gap:2px;flex:1}
.dart-mode-body b{font-size:15px;font-weight:700;color:inherit;letter-spacing:.2px}
.dart-mode-body small{font-size:12px;opacity:.7;font-weight:400;color:inherit}
.dart-mode-pill.on .dart-mode-body small{opacity:.85}
/* Regler-knap (?) ved siden af spil-type label */
.dart-rules-btn{background:transparent;border:1.5px solid var(--bdr);color:var(--t2);width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;cursor:pointer;margin-left:8px;transition:all .15s;font-family:inherit;line-height:1;padding:0;vertical-align:middle}
.dart-rules-btn:hover{border-color:var(--acc);color:var(--acc);transform:scale(1.1)}
/* Regler-modal */
.dart-rules-modal{background:var(--bg);border:1px solid var(--bdr);border-radius:18px;padding:28px 32px;min-width:760px;max-width:90vw;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.dart-rules-head{text-align:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.dart-rules-title{font-size:24px;font-weight:800;color:var(--t1)}
.dart-rules-sub{font-size:12px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;font-weight:600;margin-top:4px}
.dart-rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.dart-rules-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 20px}
.dart-rules-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.dart-rules-emoji{font-size:30px}
.dart-rules-card-head h3{margin:0;font-size:18px;color:var(--t1);font-weight:700}
.dart-rules-card-body{font-size:13px;line-height:1.55;color:var(--t2)}
.dart-rules-card-body p{margin:0 0 10px}
.dart-rules-card-body b{color:var(--t1);font-weight:700}
.dart-rules-card-body ul{margin:6px 0 12px;padding-left:0;list-style:none}
.dart-rules-card-body li{margin:4px 0;padding-left:0;line-height:1.5}
.dart-rules-foot{display:flex;justify-content:center;padding-top:14px}
.dart-rules-foot .dart-tb-btn{min-width:140px}
/* ATC target highlight på dart-board */
.dart-num.is-atc-target{background:linear-gradient(145deg,rgba(217,169,28,.30),rgba(217,169,28,.10))!important;border-color:var(--acc)!important;box-shadow:0 0 18px rgba(217,169,28,.4),inset 0 0 0 2px rgba(217,169,28,.35)!important;transform:scale(1.02)}
.dart-num.is-atc-target .dart-num-n{color:var(--acc);text-shadow:0 0 12px rgba(217,169,28,.5)}
body.light .dart-num.is-atc-target .dart-num-n{color:#8a5010;text-shadow:none}
.dart-theme-pill{display:inline-flex!important;align-items:center;gap:8px;padding-left:8px!important}
.dart-theme-swatch{width:16px;height:16px;border-radius:4px;display:inline-block;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.dart-theme-swatch-klassisk{background:linear-gradient(135deg,#d29343,#b67832)}
.dart-theme-swatch-arena{background:linear-gradient(135deg,#1f5c3a,#0d2818)}
.dart-theme-swatch-vinter{background:linear-gradient(135deg,#6ec3e8,#1a3a5a)}
.dart-theme-swatch-sport{background:linear-gradient(135deg,#e53935,#1a1a1a)}
.dart-theme-swatch-premier{background:linear-gradient(135deg,#f0c060,#1a1410);box-shadow:0 0 6px rgba(240,192,96,.4)}
.dart-theme-swatch-klubhus{background:linear-gradient(135deg,#8b1a1a 0%,#8b1a1a 40%,#e6b94a 40%,#e6b94a 70%,#ece2cf 70%);border:1px solid rgba(120,100,70,.3)}

#dart-ov[data-theme="klubhus"] .dart-pcard-stat-lbl{color:#5a4d3e}
#dart-ov[data-theme="klubhus"] .dart-pcard-turnlbl{color:#5a4d3e}
/* Multiplier + finish + start — varm guld som NEXT PLAYER */
#dart-ov[data-theme="klubhus"] .dart-mult.on,
#dart-ov[data-theme="klubhus"] .dart-finish-btn,
#dart-ov[data-theme="klubhus"] .dart-start-btn,
#dart-ov[data-theme="klubhus"] .dart-pill.on{background:linear-gradient(180deg,#e6b94a,#c89a2e)!important;border:1px solid #a07c1c!important;color:#1a1410!important;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;box-shadow:none!important;text-shadow:none}
#dart-ov[data-theme="klubhus"] .dart-finish-btn:disabled{opacity:.4}
/* Turn-name + checkout — dyb-rød accent */
#dart-ov[data-theme="klubhus"] .dart-turn-name{color:#8b1a1a;text-shadow:none;font-weight:900;letter-spacing:2px}
#dart-ov[data-theme="klubhus"] .dart-checkout{background:rgba(139,26,26,.08);border:1px solid rgba(139,26,26,.4);border-left:4px solid #8b1a1a;color:#1a1410}
#dart-ov[data-theme="klubhus"] .dart-checkout-val{color:#8b1a1a;font-weight:900}
#dart-ov[data-theme="klubhus"] .dart-checkout-lbl,
#dart-ov[data-theme="klubhus"] .dart-checkout-meta{color:#3a302a}
/* Aktiv pil-slot — stiplet dyb-rød kant */
#dart-ov[data-theme="klubhus"] .dart-slot.next{border-color:#8b1a1a!important;border-style:dashed;background:rgba(139,26,26,.05)!important}
#dart-ov[data-theme="klubhus"] .dart-slot-lbl{color:#5a4d3e}
#dart-ov[data-theme="klubhus"] .dart-slot-val,
#dart-ov[data-theme="klubhus"] .dart-slot-pts{color:#1a1410}
/* Bull/Bullseye/Miss/Undo — bevar rød accent */
#dart-ov[data-theme="klubhus"] .dart-num-bull{background:#f1e8d4!important;border-color:rgba(139,26,26,.4)!important}
#dart-ov[data-theme="klubhus"] .dart-num-bull .dart-num-n{color:#8b1a1a}
#dart-ov[data-theme="klubhus"] .dart-num-bullseye{background:#f1d4d0!important;border-color:rgba(139,26,26,.55)!important}
#dart-ov[data-theme="klubhus"] .dart-num-bullseye .dart-num-n{color:#5a0a0a}
#dart-ov[data-theme="klubhus"] .dart-num-undo .dart-num-n{color:#8b1a1a}
/* Banter-stribe nederst — match cream-paletten */
#dart-ov[data-theme="klubhus"] .dart-banter-side{background:#f1e8d4;border-color:var(--dart-card-border);border-radius:4px}
#dart-ov[data-theme="klubhus"] .dart-banter-best{background:linear-gradient(180deg,rgba(80,140,60,.12),rgba(80,140,60,.04));border-color:rgba(80,140,60,.35)}
#dart-ov[data-theme="klubhus"] .dart-banter-best .dart-banter-side-val{color:#2a6020;text-shadow:none}
#dart-ov[data-theme="klubhus"] .dart-banter-worst{background:linear-gradient(180deg,rgba(180,40,40,.12),rgba(180,40,40,.04));border-color:rgba(180,40,40,.35)}
#dart-ov[data-theme="klubhus"] .dart-banter-worst .dart-banter-side-val{color:#8b1a1a;text-shadow:none}
#dart-ov[data-theme="klubhus"] .dart-banter-side-lbl,
#dart-ov[data-theme="klubhus"] .dart-banter-side-name{color:#3a302a}
#dart-ov[data-theme="klubhus"] .dart-commentary{color:#1a1410;background:linear-gradient(180deg,rgba(230,185,74,.18),rgba(230,185,74,.05));border:1px solid rgba(200,154,46,.45);border-radius:4px}
/* Hover-feedback */
#dart-ov[data-theme="klubhus"] .dart-num:hover{background:#ede2c8!important;border-color:rgba(139,26,26,.4)!important}
#dart-ov[data-theme="klubhus"] .dart-num:active{transform:scale(.96)}

.dart-setup{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow-y:auto;background:radial-gradient(circle at 30% 20%,rgba(217,169,28,.08),transparent 50%),var(--bg)}
.dart-setup-box{max-width:540px;width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:40px 44px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.dart-setup-lbl{font-size:11px;letter-spacing:4px;color:var(--acc);text-transform:uppercase;font-weight:700;margin-bottom:10px}
.dart-setup-h{font-size:30px;font-weight:700;color:var(--t1);margin:0 0 4px;letter-spacing:-.3px}
.dart-setup-credit{font-size:12px;color:var(--t2);margin:0 0 30px;letter-spacing:.4px}
.dart-setup-row{margin-bottom:24px}
.dart-setup-label{font-size:11px;letter-spacing:2px;color:var(--t2);text-transform:uppercase;font-weight:600;margin-bottom:10px}
.dart-setup-pills{display:flex;gap:10px}
.dart-pill{background:transparent;border:1.5px solid var(--bdr);color:var(--t2);padding:10px 22px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .15s}
.dart-pill:hover{border-color:var(--acc);color:var(--t1)}
.dart-pill.on{background:var(--acc);border-color:var(--acc);color:#12100b}
.dart-setup-players{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dart-player-row{display:flex;gap:8px;align-items:center}
.dart-player-input{flex:1;background:var(--ch);border:1.5px solid var(--bdr);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--t1);font-family:inherit;outline:none;transition:border-color .15s}
.dart-player-input:focus{border-color:var(--acc)}
.dart-player-remove{background:transparent;border:1px solid var(--bdr);color:var(--t2);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:12px;display:grid;place-items:center;flex-shrink:0;transition:all .15s}
.dart-player-remove:hover{border-color:#c55d3f;color:#c55d3f}
.dart-add-player{background:transparent;border:1px dashed var(--bdr);color:var(--t2);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;width:fit-content;letter-spacing:.5px;transition:all .15s}
.dart-add-player:hover{border-color:var(--acc);color:var(--t1)}
.dart-setup-toggle{display:flex;align-items:center}
.dart-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--t2)}
.dart-toggle input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.dart-start-btn{background:linear-gradient(145deg,#b67832,#d29343 58%,#77451d);color:#fff8ec;border:0;border-radius:10px;padding:14px 32px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;width:100%;box-shadow:0 12px 30px rgba(184,112,40,.32),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .14s,box-shadow .14s}
.dart-start-btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(184,112,40,.45)}
.dart-start-btn:active{transform:scale(.98)}
/* Spil-tilstand */
.dart-game{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:18px 22px 148px;gap:16px;background:radial-gradient(circle at 50% 0%,rgba(217,169,28,.05),transparent 40%),var(--bg);position:relative}
/* Bottom-bar: stats-fold + banter-stribe pinnet til allernederste kant */
.dart-bottom-bar{position:absolute;left:22px;right:22px;bottom:10px;display:flex;flex-direction:column;align-items:stretch;gap:4px;pointer-events:none;z-index:2}
.dart-bottom-bar > *{pointer-events:auto}
.dart-bottom-bar details[open]{background:var(--bg);border-radius:14px;padding:4px 0;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
/* Pi/narrow: reservér mere plads siden banter-row staker (uden stats-fold) */
@media(max-width:1100px){
  .dart-game{padding-bottom:230px}
}
.dart-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-shrink:0;flex-wrap:wrap}
.dart-topbar-left{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.dart-game-lbl{font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.75);text-transform:uppercase;font-weight:700}
body.light .dart-game-lbl{color:rgba(0,0,0,.7)}
.dart-mini-standings{display:flex;gap:8px;flex-wrap:wrap;font-size:11px}
/* Round-out banner: vises i topbar når en vinder er fundet men runden ikke er færdig */
.dart-roundout-banner{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:6px 14px;background:linear-gradient(90deg,rgba(217,169,28,.20),rgba(217,169,28,.06));border:1px solid rgba(217,169,28,.45);border-radius:999px;font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.3px;animation:dart-roundout-pulse 2.4s ease-in-out infinite}
.dart-roundout-end{background:rgba(217,169,28,.18);border:1px solid rgba(217,169,28,.5);color:var(--acc);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:all .15s}
.dart-roundout-end:hover{background:rgba(217,169,28,.32);transform:translateY(-1px)}
@keyframes dart-roundout-pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,169,28,.3)}50%{box-shadow:0 0 0 6px rgba(217,169,28,0)}}
body.light .dart-roundout-banner{color:#8a5010;background:linear-gradient(90deg,rgba(180,130,30,.18),rgba(180,130,30,.06));border-color:rgba(180,130,30,.45)}
.dart-mini-row{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-left:3px solid var(--p-color);border-radius:6px;color:rgba(255,255,255,.85);letter-spacing:.3px;font-weight:600;font-size:12px}
.dart-mini-row b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
body.light .dart-mini-row{background:rgba(0,0,0,.04);color:rgba(0,0,0,.78)}
body.light .dart-mini-row b{color:#1c1814}
.dart-topbar-btns{display:flex;gap:8px}
.dart-tb-btn{background:transparent;border:1px solid var(--bdr);color:var(--t2);padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .15s}
.dart-tb-btn:hover{border-color:var(--acc);color:var(--t1);background:rgba(217,169,28,.06)}
.dart-players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;flex-shrink:0}
/* ═══ SPILLER-KORT (split layout — venstre identitet, højre stats) ═══ */
.dart-pcard{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:0;transition:all .2s;position:relative;overflow:hidden;--p-color:#d29343;--p-color-light:#8a5010;display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(140px,1fr);min-height:148px}
.dart-pcard-left{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--ch);border-right:1px solid var(--bdr);border-radius:14px 0 0 14px;position:relative;overflow:hidden}
.dart-pcard-left::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p-color);opacity:.4}
.dart-pcard-right{padding:12px 14px;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.dart-pcard.active .dart-pcard-left{background:linear-gradient(145deg,color-mix(in srgb,var(--p-color) 80%,#000),color-mix(in srgb,var(--p-color) 65%,#000));color:#fff}
.dart-pcard.active .dart-pcard-left::before{opacity:0}
.dart-pcard.active{border-color:var(--p-color);box-shadow:0 0 28px color-mix(in srgb,var(--p-color) 30%,transparent)}
.dart-pcard.won .dart-pcard-left{background:linear-gradient(145deg,#b08a1c,#76570f);color:#fff}
.dart-pcard.won{border-color:#f0c060}
.dart-pname{font-size:14px;font-weight:800;color:var(--t1);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dart-pdot{width:9px;height:9px;border-radius:50%;background:var(--p-color);box-shadow:0 0 8px var(--p-color);flex-shrink:0}
.dart-pcard.active .dart-pname{color:#fff}
.dart-pcard.active .dart-pdot{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
.dart-pcard.won .dart-pname{color:#fff}
.dart-pcard.won .dart-pdot{background:#fff}
.dart-pcard-pts{margin-left:auto;font-size:11px;letter-spacing:.5px;color:var(--p-color);background:color-mix(in srgb,var(--p-color) 14%,transparent);padding:2px 8px;border-radius:999px;font-weight:800}
.dart-pcard.active .dart-pcard-pts,
.dart-pcard.won .dart-pcard-pts{color:rgba(255,255,255,.9);background:rgba(255,255,255,.15)}
.dart-pscore{font-size:54px;font-weight:900;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.dart-pcard.active .dart-pscore{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.dart-pcard.won .dart-pscore{color:#fff}
.dart-pcard-turnlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);font-weight:700;text-align:center;min-height:14px}
.dart-pcard.active .dart-pcard-turnlbl{color:rgba(255,255,255,.85)}
.dart-pcard.won .dart-pcard-turnlbl{color:rgba(255,255,255,.95)}
/* Højre side: kompakte ikon-rækker */
.dart-pcard-stat{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:8px;transition:all .2s}
.dart-pcard-stat-ico{font-size:18px;flex-shrink:0;width:22px;text-align:center;opacity:.85;filter:saturate(.9)}
.dart-pcard-stat-body{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.dart-pcard-stat-lbl{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dart-pcard-stat-val{font-size:18px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1}
body.light .dart-pcard-left{background:rgba(0,0,0,.025)}
/* MEDAL-rækker: kun synlige på spilleren der holder game-wide bedste/værste */
.dart-pcard-stat.is-best{background:linear-gradient(135deg,rgba(100,200,120,.18),rgba(100,200,120,.05));border:1px solid rgba(100,200,120,.45);box-shadow:0 0 16px rgba(100,200,120,.18);padding:5px 8px}
.dart-pcard-stat.is-best .dart-pcard-stat-ico{font-size:22px;opacity:1;filter:drop-shadow(0 0 6px rgba(100,200,120,.45))}
.dart-pcard-stat.is-best .dart-pcard-stat-val{font-size:22px;color:#5fc878;text-shadow:0 0 10px rgba(100,200,120,.3)}
.dart-pcard-stat.is-best .dart-pcard-stat-lbl{color:#5fc878;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px}
.dart-pcard-stat.is-worst{background:linear-gradient(135deg,rgba(229,80,80,.16),rgba(229,80,80,.04));border:1px solid rgba(229,80,80,.45);box-shadow:0 0 16px rgba(229,80,80,.15);padding:5px 8px}
.dart-pcard-stat.is-worst .dart-pcard-stat-ico{font-size:22px;opacity:1}
.dart-pcard-stat.is-worst .dart-pcard-stat-val{font-size:22px;color:#e85050;text-shadow:0 0 10px rgba(229,80,80,.3)}
.dart-pcard-stat.is-worst .dart-pcard-stat-lbl{color:#e85050;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px}
body.light .dart-pcard-stat.is-best{background:linear-gradient(135deg,rgba(60,160,90,.16),rgba(60,160,90,.04));border-color:rgba(60,160,90,.5)}
body.light .dart-pcard-stat.is-best .dart-pcard-stat-val,
body.light .dart-pcard-stat.is-best .dart-pcard-stat-lbl{color:#3a8a4a;text-shadow:none}
body.light .dart-pcard-stat.is-worst{background:linear-gradient(135deg,rgba(200,60,55,.15),rgba(200,60,55,.04));border-color:rgba(200,60,55,.5)}
body.light .dart-pcard-stat.is-worst .dart-pcard-stat-val,
body.light .dart-pcard-stat.is-worst .dart-pcard-stat-lbl{color:#c43838;text-shadow:none}
/* Klubhus-tema medal-styling — mat på den klassiske tablet-baggrund */
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-best{background:linear-gradient(135deg,rgba(40,140,70,.20),rgba(40,140,70,.06))!important;border-color:rgba(40,140,70,.55)!important;box-shadow:none!important}
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-best .dart-pcard-stat-val,
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-best .dart-pcard-stat-lbl{color:#2a6020!important;text-shadow:none}
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-worst{background:linear-gradient(135deg,rgba(139,26,26,.20),rgba(139,26,26,.06))!important;border-color:rgba(139,26,26,.55)!important;box-shadow:none!important}
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-worst .dart-pcard-stat-val,
#dart-ov[data-theme="klubhus"] .dart-pcard-stat.is-worst .dart-pcard-stat-lbl{color:#8b1a1a!important;text-shadow:none}
.dart-stat-180{background:rgba(217,169,28,.18)!important;color:#f0c060!important;font-weight:700}
.dart-stat-140{background:rgba(217,169,28,.10)!important;color:#d8a85c!important}
.dart-stat-100{background:rgba(217,169,28,.06)!important;color:#c89860!important}
.dart-stat-bust{background:rgba(197,93,63,.14)!important;color:#c55d3f!important}
body.light .dart-stat-180{color:#8a5010!important}
body.light .dart-stat-140{color:#9a6020!important}
body.light .dart-stat-100{color:#a07030!important}
.dart-plast{font-size:13px;color:rgba(255,255,255,.7);margin-top:10px;font-style:italic}
body.light .dart-plast{color:rgba(0,0,0,.65)}

/* SKJUL kø-panel når dart er aktivt — så vi får mere plads til dartspillet */
body.dart-active .panel{display:none!important}
body.dart-active .main{margin-right:0}
body.dart-active #dart-ov{right:0!important;bottom:0!important;inset:0!important}
/* Skjul nu-spiller-baren (.bb) når dart er aktiv — ellers efterlader den en tom stribe
   nederst hvor commentary ikke kan nå ned. Samme princip som body.havehus-active. */
body.dart-active .bb{display:none!important}

/* Havehus-overlay: behold kø-panel synligt (havehus fylder kun midten — masser af plads) */
/* body.havehus-active .panel{display:none!important}  ← fjernet, panel skal være synligt */

/* Havehus-overlay skal nå HELT til bunden af siden — ellers vises der en tom
   strimmel under panelet hvor nu-spiller-baren normalt ville være (var(--bh)).
   Den strimmel skaber en synlig linje på tværs af bunden. */
body.havehus-active #havehus-ov.dz-overlay{
  inset:0 !important;
}
/* Skjul den nederste nu-spiller-bar når havehus er aktiv */
body.havehus-active .bb{display:none!important}
/* STUE: samme principper som havehus — fuld overlay, skjul nu-spiller-bar */
body.stue-active #stue-ov.dz-overlay{ inset:0 !important; }
body.stue-active .bb{ display:none !important }
/* Pil-slots + multiplier + dartboard-grid */
.dart-turn-bar{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px 20px;flex-shrink:0}
.dart-turn-name{font-size:15px;letter-spacing:1.5px;color:var(--acc);text-transform:uppercase;font-weight:800;white-space:nowrap;text-shadow:0 0 12px rgba(217,169,28,.25)}
body.light .dart-turn-name{text-shadow:none;color:#8a5010}
.dart-darts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dart-slot{background:var(--ch);border:1.5px solid var(--bdr);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;min-height:64px;justify-content:center}
.dart-slot.next{border-color:var(--acc);border-style:dashed;background:rgba(217,169,28,.04);box-shadow:0 0 12px rgba(217,169,28,.15) inset}
.dart-slot.filled{background:rgba(217,169,28,.10);border-color:rgba(217,169,28,.45);border-style:solid}
.dart-slot-lbl{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.65);text-transform:uppercase;font-weight:700}
body.light .dart-slot-lbl{color:rgba(0,0,0,.6)}
.dart-slot-val{font-size:26px;font-weight:800;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums}
.dart-slot.filled .dart-slot-val{color:#f0c060;text-shadow:0 0 16px rgba(217,169,28,.4)}
body.light .dart-slot.filled .dart-slot-val{color:#8a5010;text-shadow:none}
.dart-slot-pts{font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.3px;font-weight:600}
body.light .dart-slot-pts{color:rgba(0,0,0,.6)}

<body>

<div id="dart-ov" class="dz-overlay" style="display:none;flex-direction:column"></div>

<div class="modal-bg" id="modal-bg" style="display:none" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box" onclick="event.stopPropagation()"></div>
</div>

<div class="toasts" id="toasts"></div>

<script>
// ── Hjælpefunktioner (uddraget fra jukebox.html) ──
const $ = id => document.getElementById(id);
const qs = (sel, el=document) => el.querySelector(sel);

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, dur=3000) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), dur);
}

function openModal(html, opts) {
  const box = $('modal-box');
  box.innerHTML = html;
  if (opts && opts.wide) {
    box.style.cssText = 'background:transparent;border:none;padding:0;width:auto;max-width:none;max-height:92vh;overflow-y:auto';
  } else {
    box.style.cssText = '';
  }
  $('modal-bg').style.display = 'flex';
}

function closeModal(e) {
  if (e && e.target !== $('modal-bg')) return;
  $('modal-bg').style.display = 'none';
  $('modal-box').style.cssText = '';
}
window.closeModal = closeModal;

// ── DART-LOGIK (uddraget fra jukebox.html) ──
const _DART_STORAGE_KEY = '_dartState_v1';
let _dartState = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(_DART_STORAGE_KEY) || 'null');
    if (!s) return null;
    // Migrering fra gammelt format (pendingInput string → pendingDarts array)

// Hjælper: backward-compat
function _dartEndRule(s) {
  if (!s) return 'first';
  if (s.endRule) return s.endRule;
  if (s.playRoundOut) return 'round';
  return 'first';
}
function _dartGameMode(s) {
  if (!s) return 'x01';
  return s.gameMode || 'x01';  // gamle gemte spil = X01
}

function renderDart() {
  const ov = $('dart-ov');
  if (!ov) return;
  if (!_dartState || !_dartState.setupDone) return _renderDartSetup(ov);
  const s = _dartState;
  const mode = _dartGameMode(s);
  // Cricket er endnu ikke implementeret — vis placeholder
  if (mode === 'cricket') return _renderDartCricketPlaceholder(ov);
  // Around the Clock — egen game-renderer; vinder = nået målet
  if (mode === 'aroundclock') {
    if (s.winner != null) {
      const rule = _dartEndRule(s);
      // Round-out/finish opfører sig som X01: vis vinder først når alle har spillet/finishet
      if (rule === 'round'  && (s.turnsSinceWin || 0) < s.players.length - 1) return _renderAtcGame(ov);
      if (rule === 'finish' && !s.players.every(p => p.atcTarget > 25))         return _renderAtcGame(ov);
      return _renderDartWinner(ov);
    }
    return _renderAtcGame(ov);
  }
  // X01 (default)
  if (s.winner != null) {
    const rule = _dartEndRule(s);
    if (rule === 'round' && (s.turnsSinceWin || 0) < s.players.length - 1) {
      return _renderDartGame(ov);
    }
    if (rule === 'finish' && !s.players.every(p => p.score === 0)) {
      return _renderDartGame(ov);
    }
    return _renderDartWinner(ov);
  }
  _renderDartGame(ov);
}

// Beregn detaljeret statistik for en spiller fra deres historik
function _dartStats(p) {
  const turns = p.history.length;
  // Antal darts thrown — brug darts-arrayet hvis det findes, ellers 3 pr. tur
  const dartsThrown = p.history.reduce((sum, h) => sum + (Array.isArray(h.darts) ? h.darts.length : 3), 0);
  const total = p.totalThrown || 0;
  const avg3 = turns ? Math.round(total / turns * 10) / 10 : 0;       // 3-dart avg
  const avg1 = dartsThrown ? Math.round(total / dartsThrown * 100) / 100 : 0; // 1-dart avg
  // First 9 average (gennemsnit af første 3 ture = første 9 pile, klassisk pro-stat)
  const first3Turns = p.history.slice(0, 3).filter(h => !h.bust);
  const first9Total = first3Turns.reduce((s, h) => s + h.throw, 0);
  const first9Darts = first3Turns.reduce((s, h) => s + (Array.isArray(h.darts) ? h.darts.length : 3), 0);
  const first9Avg = first9Darts ? Math.round(first9Total / first9Darts * 3 * 10) / 10 : 0;
  // Antal 100+, 140+, 180
  let n100 = 0, n140 = 0, n180 = 0;
  for (const h of p.history) {
    if (h.bust) continue;
    if (h.throw >= 180) n180++;
    else if (h.throw >= 140) n140++;
    else if (h.throw >= 100) n100++;
  }
  const busts = p.history.filter(h => h.bust).length;
  // Ringeste tur: laveste ikke-bust tur (vi springer 0-misses over så det ikke altid er 0)
  let lowest = 0;
  const realThrows = p.history.filter(h => !h.bust && h.throw > 0).map(h => h.throw);
  if (realThrows.length) lowest = Math.min(...realThrows);
  return { turns, dartsThrown, total, avg3, avg1, first9Avg, n100, n140, n180, busts, highest: p.highest, lowest };
}

function _dartCheckout(score, dartsLeft) {
  if (score < 2 || score > 170 || dartsLeft < 1) return null;
  if (dartsLeft >= 3) return _CHECKOUTS_3[score] || _dartCheckout2(score) || _dartCheckout1(score);
  if (dartsLeft === 2) return _dartCheckout2(score) || _dartCheckout1(score);
  return _dartCheckout1(score);
}
function _dartCheckout1(score) {
  // 1 dart finish — kun double eller bullseye
  if (score === 50) return 'Bull';
  if (score % 2 === 0 && score >= 2 && score <= 40) return `D${score/2}`;
  return null;
}
function _dartCheckout2(score) {
  // 2 dart finish — første pil hvadsomhelst, anden er double/bull
  if (score < 4 || score > 110) return null;
  // Prøv Bull som finish
  if (score > 50) {
    const r = score - 50;
    if (r >= 1 && r <= 20) return `S${r} Bull`;
    if (r % 3 === 0 && r/3 <= 20) return `T${r/3} Bull`;
    if (r % 2 === 0 && r/2 <= 20) return `D${r/2} Bull`;
  }
  // Prøv D20 → D1 som finish, foretrukket høje
  for (let d = 20; d >= 1; d--) {
    const r = score - d * 2;
    if (r < 0) continue;
    if (r === 0) continue; // ren D-finish er 1-pil
    if (r >= 1 && r <= 20) return `S${r} D${d}`;
    if (r === 25) return `Bull D${d}`;
    if (r % 3 === 0 && r/3 <= 20) return `T${r/3} D${d}`;
    if (r % 2 === 0 && r/2 <= 20) return `D${r/2} D${d}`;
  }
  return null;
}

// Find bedste og værste ENKELT-PIL (kast) på tværs af alle spillere.
// "Kast" = én enkelt pil. "Runde" = 3-pil tur. Miss tæller ikke som værste.
// Returnerer { best: { value, holders: [{name,colorIdx}] }, worst: ... } så TIED holdere ses.
function _dartHighlightsDarts(s) {
  if (!s || !s.players) return { best: null, worst: null };
  let bestVal = -Infinity, worstVal = Infinity;
  const allDarts = [];
  s.players.forEach(p => {
    (p.history || []).forEach(h => {
      (h.darts || []).forEach(label => {
        const d = _dartParseLabel(label);
        if (!d) return; // miss
        const value = d.num * d.mult;
        if (value <= 0) return;
        allDarts.push({ value, name: p.name, colorIdx: p.colorIdx });
        if (value > bestVal)  bestVal  = value;
        if (value < worstVal) worstVal = value;
      });
    });
  });
  if (!allDarts.length) return { best: null, worst: null };
  // Saml alle UNIKKE spillere der har bedste/værste-værdien
  const uniqHolders = (arr, value) => {
    const seen = new Set();
    return arr.filter(d => d.value === value).filter(d => {
      if (seen.has(d.name)) return false;
      seen.add(d.name); return true;
    });
  };
  const best  = { value: bestVal,  holders: uniqHolders(allDarts, bestVal) };
  let worst   = { value: worstVal, holders: uniqHolders(allDarts, worstVal) };
  // Hvis bedste og værste er samme værdi (kun ét kast i spillet), skjul værste
  if (best.value === worst.value) worst = null;
  return { best, worst };
}

// Find bedste og værste RUNDE (3-pil tur) på tværs af alle spillere i det igangværende spil.
// Bust tæller IKKE som værste — vi bruger laveste rigtige tur i stedet (mere fair).
// Returnerer { best: { value, holders: [...] }, worst: ... } så TIED holdere ses.
function _dartHighlights(s) {
  if (!s || !s.players) return { best: null, worst: null };
  let bestVal = -Infinity, worstVal = Infinity;
  const allRounds = [];
  s.players.forEach(p => {
    (p.history || []).forEach(h => {
      if (h.bust) return;
      if (h.throw === 0) return;
      allRounds.push({ value: h.throw, name: p.name, colorIdx: p.colorIdx });
      if (h.throw > bestVal)  bestVal  = h.throw;
      if (h.throw < worstVal) worstVal = h.throw;
    });
  });
  if (!allRounds.length) return { best: null, worst: null };
  const uniqHolders = (arr, value) => {
    const seen = new Set();
    return arr.filter(r => r.value === value).filter(r => {
      if (seen.has(r.name)) return false;
      seen.add(r.name); return true;
    });
  };
  const best  = { value: bestVal,  holders: uniqHolders(allRounds, bestVal) };
  let worst   = { value: worstVal, holders: uniqHolders(allRounds, worstVal) };
  if (best.value === worst.value) worst = null;
  return { best, worst };
}

// Deterministisk valg fra et array — så kommentator-teksten ikke skifter ved hvert klik,
// men kun når spilleren / turen reelt har ændret sig.
function _dartSeededPick(arr, seed) {
  if (!arr.length) return '';
  let h = 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) | 0;
  return arr[Math.abs(h) % arr.length];
}

// Parse en pil-label til {num, mult}. "20"→{20,1}, "D20"→{20,2}, "T20"→{20,3}, "Bull"→{25,1}, "Bullseye"→{25,2}, "—"→null.
function _dartParseLabel(label) {
  if (!label || label === '—') return null;
  if (label === 'Bull')     return { num: 25, mult: 1 };
  if (label === 'Bullseye') return { num: 25, mult: 2 };
  const m = String(label).match(/^([DT]?)(\d+)$/);
  if (!m) return null;
  return { num: parseInt(m[2], 10), mult: m[1] === 'T' ? 3 : (m[1] === 'D' ? 2 : 1) };
}

// Progression: 1, 2, 3, ..., 19, 20, 25 (bullseye), 26 (færdig)
// 21 mål i alt (1-20 + bullseye)
function _atcNextTarget(t) {
  if (t === 20) return 25;        // efter 20 → bullseye (21 findes ikke på brættet)
  if (t === 25) return 26;        // efter bullseye → færdig
  if (t >= 26)  return 26;
  return t + 1;
}
function _atcProgress(t) {
  let done;
  if (t >= 26) done = 21;
  else if (t === 25) done = 20;
  else done = t - 1;
  return Math.round((done / 21) * 100);
}
function _atcTilMaal(t) {
  if (t >= 26) return 0;
  if (t === 25) return 1;
  return 22 - t;  // fx t=1 → 21, t=20 → 2 (20 + bullseye)
}

function _renderAtcGame(ov) {
  const s = _dartState;
  ov.setAttribute('data-theme', s.theme || 'klassisk');
  // Self-heal #1: tidligere bug satte atcTarget=21 efter at have ramt 20. Rebound til 25.
  let healed = false;
  s.players.forEach(p => {
    if (p.atcTarget === 21 || p.atcTarget === 22 || p.atcTarget === 23 || p.atcTarget === 24) {
      p.atcTarget = 25;
      healed = true;
    }

  // Self-heal #2: hvis ALLE er færdige men spillet ikke er afsluttet, afslut nu.
  // Fanger fastlåste spil fra tidligere bug i 'round' mode.
  if (s.players.every(p => p.atcTarget > 25) && s.players.length > 0) {
    // Sørg for at alle har finishedAt sat (ranger bagudkompatibelt)
    let nextRank = (s.finishCount || 0);
    s.players.forEach(p => {
      if (p.atcTarget > 25 && p.finishedAt == null) {
        nextRank += 1;
        p.finishedAt = nextRank;
      }
    });
    s.finishCount = nextRank;
    if (s.winner == null) {
      // Find første der finisher
      const firstFinisher = s.players.findIndex(p => p.finishedAt === 1);
      if (firstFinisher >= 0) s.winner = firstFinisher;
    }
    _awardTournamentPoints();
    s.pendingDarts = []; s.multiplier = 1;
    _saveDart();
    return _renderDartWinner(ov);
  }

function _dartAtcHit(n) {
  if (!_dartState) return;
  const s = _dartState;
  if (s.pendingDarts.length >= 3) { toast('Already 3 darts — press Finish'); return; }
  const m = s.multiplier;
  const player = s.players[s.currentPlayer];
  let label;
  if (n === 0) label = '—';
  else if (m === 2) label = `D${n}`;
  else if (m === 3) label = `T${n}`;
  else label = `${n}`;
  // Hit kun hvis nummer matcher aktuelt mål (single/double/triple alle tæller som ét hit)
  const hit = (n > 0) && (n === player.atcTarget);
  if (hit) player.atcTarget = _atcNextTarget(player.atcTarget);
  s.pendingDarts.push({ value: hit ? 1 : 0, label, hit, num: n });
  s.multiplier = 1;
  _saveDart();
  renderDart();
}
function _dartAtcHitBull(v) {
  if (!_dartState) return;
  const s = _dartState;
  if (s.pendingDarts.length >= 3) { toast('Already 3 darts — press Finish'); return; }
  const player = s.players[s.currentPlayer];
  const label = v === 50 ? 'Bullseye' : 'Bull';
  // Bullseye/Bull tæller kun hvis aktuelt mål er bullseye (target = 25)
  const hit = (player.atcTarget === 25);
  if (hit) player.atcTarget = _atcNextTarget(player.atcTarget);
  s.pendingDarts.push({ value: hit ? 1 : 0, label, hit, num: 25 });
  s.multiplier = 1;
  _saveDart();
  renderDart();
}
function _dartAtcFinishTurn() {
  if (!_dartState) return;
  const s = _dartState;
  if (!s.pendingDarts.length) { toast('Throw at least one dart first'); return; }
  const player = s.players[s.currentPlayer];
  const dartLabels = s.pendingDarts.map(d => d.label);
  const hits = s.pendingDarts.filter(d => d.hit).length;
  player.history.push({ throw: hits, darts: dartLabels, score: player.atcTarget, bust: false });
  player.totalThrown += hits;
  if (hits > player.highest) player.highest = hits;

  const rule = _dartEndRule(s);
  const justFinished = (player.atcTarget > 25 && player.finishedAt == null);

  if (justFinished) {
    s.finishCount = (s.finishCount || 0) + 1;
    player.finishedAt = s.finishCount;
    if (s.winner == null) {
      // Første finisher = vinder, start round-out tæller
      s.winner = s.currentPlayer;
      s.turnsSinceWin = 0;
    } else if (rule === 'round') {
      // En senere finisher — tæl turen med (i stedet for at nulstille)
      s.turnsSinceWin = (s.turnsSinceWin || 0) + 1;
    }
    if (rule === 'first') {
      _awardTournamentPoints();
      s.pendingDarts = []; s.multiplier = 1;
      _saveDart(); renderDart();
      return;
    }
  } else if (s.winner != null && rule === 'round') {
    s.turnsSinceWin = (s.turnsSinceWin || 0) + 1;
  }

  // UNIVERSAL slut-tjek: hvis alle er færdige, afslut spillet (gælder alle modes
  // efter en vinder er fundet — beskytter mod stuck-spil i 'round' og 'finish').
  if (s.players.every(p => p.atcTarget > 25)) {
    _awardTournamentPoints();
    s.pendingDarts = []; s.multiplier = 1;
    _saveDart(); renderDart();
    return;
  }
  // 'round' specifik: alle har spillet deres sidste tur
  if (rule === 'round' && s.winner != null && (s.turnsSinceWin || 0) >= s.players.length - 1) {
    _awardTournamentPoints();
    s.pendingDarts = []; s.multiplier = 1;
    _saveDart(); renderDart();
    return;
  }

  // Advance til næste spiller, spring de færdige over (round/finish)
  s.currentPlayer = (s.currentPlayer + 1) % s.players.length;
  if (rule === 'round' || rule === 'finish') {
    let safety = 0;
    while (s.players[s.currentPlayer].atcTarget > 25 && safety < s.players.length) {
      s.currentPlayer = (s.currentPlayer + 1) % s.players.length;
      safety++;
    }
  }
  s.pendingDarts = []; s.multiplier = 1;
  _saveDart(); renderDart();
}
window._dartAtcHit = _dartAtcHit;
window._dartAtcHitBull = _dartAtcHitBull;
window._dartAtcFinishTurn = _dartAtcFinishTurn;

  // Reset multiplier til single efter hvert kast (forhindrer at man glemmer)
  s.multiplier = 1;
  _saveDart();
  renderDart();
  // Auto-færdiggør hvis spilleren ramte præcis 0
  const p = s.players[s.currentPlayer];
  const sum = s.pendingDarts.reduce((a, d) => a + d.value, 0);
  if (p.score - sum === 0 && s.pendingDarts.length <= 3) {
    setTimeout(() => _dartFinishTurn(), 200);
  }
}
function _dartHitBull(v) {
  if (!_dartState) return;
  const s = _dartState;
  if (s.pendingDarts.length >= 3) { toast('Already 3 darts — press Finish'); return; }
  s.pendingDarts.push({
    value: v,
    label: v === 50 ? 'Bullseye' : 'Bull',
    isDouble: v === 50,   // bullseye tæller som double i double-out reglen
    isBull: true,
  });
  s.multiplier = 1;
  _saveDart();
  renderDart();
  const p = s.players[s.currentPlayer];
  const sum = s.pendingDarts.reduce((a, d) => a + d.value, 0);
  if (p.score - sum === 0 && s.pendingDarts.length <= 3) {
    setTimeout(() => _dartFinishTurn(), 200);
  }
}
function _dartUndoDart() {
  if (!_dartState) return;
  if (!_dartState.pendingDarts.length) { toast('No darts to undo'); return; }
  _dartState.pendingDarts.pop();
  _saveDart();
  renderDart();
}
function _dartFinishTurn() {
  if (!_dartState) return;
  const s = _dartState;
  if (!s.pendingDarts.length) { toast('Throw at least one dart first'); return; }
  const player = s.players[s.currentPlayer];
  const dartLabels = s.pendingDarts.map(d => d.label);
  const val = s.pendingDarts.reduce((a, d) => a + d.value, 0);
  const lastDart = s.pendingDarts[s.pendingDarts.length - 1];
  const newScore = player.score - val;

  let bust = false;
  if (newScore < 0)                                                       bust = true;
  else if (newScore === 1 && s.doubleOut)                                 bust = true;  // kan ikke slutte på 1 ved double-out
  else if (newScore === 0 && s.doubleOut && !lastDart.isDouble)           bust = true;  // skal slutte på en double

  if (bust) {
    player.history.push({ throw: val, darts: dartLabels, score: player.score, bust: true });
    toast(`BUST! ${player.name} scored no points`);
  } else {
    player.history.push({ throw: val, darts: dartLabels, score: newScore, bust: false });
    player.score = newScore;
    player.totalThrown += val;
    if (val > player.highest) player.highest = val;
  }

  // Winner-håndtering — afhænger af endRule ('first' | 'round' | 'finish')
  const rule = _dartEndRule(s);

  // Hvis spilleren netop nåede 0, registrer det
  if (player.score === 0 && player.finishedAt == null) {
    s.finishCount = (s.finishCount || 0) + 1;
    player.finishedAt = s.finishCount;
    if (s.winner == null) s.winner = s.currentPlayer;
    if (s.winner === s.currentPlayer && (rule === 'round' || rule === 'finish')) {
      // Lige blevet vinder — start round-out tæller (selv for finish-mode bruger vi den til intet)
      s.turnsSinceWin = 0;
    }
    if (rule === 'first') {
      // Klassisk regel: stop med det samme
      _awardTournamentPoints();
      s.pendingDarts = [];
      s.multiplier = 1;
      _saveDart();
      renderDart();
      return;
    }
  } else if (s.winner != null && rule === 'round') {
    s.turnsSinceWin = (s.turnsSinceWin || 0) + 1;
  }

  // 'round' slutter når alle har spillet deres sidste tur (N-1 ekstra ture)
  if (rule === 'round' && s.winner != null && (s.turnsSinceWin || 0) >= s.players.length - 1) {
    _awardTournamentPoints();
    s.pendingDarts = [];
    s.multiplier = 1;
    _saveDart();
    renderDart();
    return;
  }

  // 'finish' slutter når ALLE spillere er på 0
  if (rule === 'finish' && s.players.every(p => p.score === 0)) {
    _awardTournamentPoints();
    s.pendingDarts = [];
    s.multiplier = 1;
    _saveDart();
    renderDart();
    return;
  }

  // Advance til næste spiller
  s.currentPlayer = (s.currentPlayer + 1) % s.players.length;

  // I 'round' og 'finish' skal spillere ved 0 springes over
  if (rule === 'round' || rule === 'finish') {
    let safety = 0;
    while (s.players[s.currentPlayer].score === 0 && safety < s.players.length) {
      s.currentPlayer = (s.currentPlayer + 1) % s.players.length;
      safety++;
    }
    // Sikkerhed: alle er ved 0 — slut spillet
    if (s.players.every(p => p.score === 0)) {
      _awardTournamentPoints();
      s.pendingDarts = [];
      s.multiplier = 1;
      _saveDart();
      renderDart();
      return;
    }
  }
  s.pendingDarts = [];
  s.multiplier = 1;
  _saveDart();
  renderDart();
}

// Uddel turneringspoint efter et spil: 1.plads = N point, 2.plads = N-1, osv.
// Placering: vinder først, derefter sorteret efter laveste resterende score.
function _awardTournamentPoints() {
  const s = _dartState;
  if (!s.tournament) s.tournament = { _gameNumber: 1, scores: {} };
  if (!s.tournament.scores) s.tournament.scores = {};

  const mode = _dartGameMode(s);
  const playersByPlace = s.players
    .map((p, idx) => ({ p, idx }))
    .sort((a, b) => {
      const aDone = a.p.finishedAt != null;
      const bDone = b.p.finishedAt != null;
      if (aDone && bDone) return a.p.finishedAt - b.p.finishedAt;
      if (aDone) return -1;
      if (bDone) return 1;
      // ATC: højere atcTarget = bedre (længere fremme). X01: lavere score = bedre.
      if (mode === 'aroundclock') return (b.p.atcTarget || 0) - (a.p.atcTarget || 0);
      return a.p.score - b.p.score;
    });
  const N = s.players.length;
  playersByPlace.forEach(({ p }, place) => {
    const pts = N - place;
    if (!s.tournament.scores[p.name]) {
      s.tournament.scores[p.name] = { points: 0, wins: 0, games: 0, colorIdx: p.colorIdx };
    }
    s.tournament.scores[p.name].points += pts;
    s.tournament.scores[p.name].games += 1;
    if (place === 0) s.tournament.scores[p.name].wins += 1;
  });
  s.tournament._gameNumber = s.gameNumber || 1;
}

function _dartNextGame() {
  // Fortsæt turnering: samme spillere, samme regler, akkumulerede point
  if (!_dartState) return;
  const s = _dartState;
  const names = s.players.map(p => p.name);
  _dartState = _newDartGame(s.startScore, names, s.doubleOut, s.tournament, s.theme, _dartEndRule(s), _dartGameMode(s), s.cricketVariant);
  _saveDart();
  renderDart();
}

function _dartEndTournament() {
  if (!confirm('End the tournament and return to setup? Points will be reset.')) return;
  if (_dartState) {
    _dartState.setupDone = false;
    _dartState.tournament = { _gameNumber: 1, scores: {} };
    _dartState.gameNumber = 1;
  }
  _saveDart();
  renderDart();
}
window._dartNextGame = _dartNextGame;
window._dartEndTournament = _dartEndTournament;

// Afslut 'finish'-mode spil manuelt (bruges når sidste spillere ikke kan finishe)
function _dartForceEnd() {
  if (!_dartState) return;
  if (!confirm('End the game now? The remaining players will be ranked by lowest score.')) return;
  _awardTournamentPoints();
  _dartState.pendingDarts = [];
  _dartState.multiplier = 1;
  _saveDart();
  renderDart();
}
window._dartForceEnd = _dartForceEnd;
function _dartUndo() {
  if (!_dartState) return;
  const s = _dartState;
  // Hvis spilleren er i gang med en tur (har pendingDarts), ryd dem
  if (s.pendingDarts && s.pendingDarts.length) {
    s.pendingDarts = [];
    s.multiplier = 1;
    _saveDart();
    renderDart();
    return;
  }
  // Find sidste spiller der kastede (forrige i rækkefølge eller vinder)
  let prevIdx;
  if (s.playRoundOut && s.winner != null && (s.turnsSinceWin || 0) > 0) {
    // I "spil runden færdig"-fasen — gå tilbage til forrige spiller (springer 0-scorere over)
    let p = (s.currentPlayer - 1 + s.players.length) % s.players.length;
    let safety = 0;
    while (s.players[p].score === 0 && p !== s.winner && safety < s.players.length) {
      p = (p - 1 + s.players.length) % s.players.length;
      safety++;
    }
    prevIdx = p;
    s.turnsSinceWin = Math.max(0, (s.turnsSinceWin || 0) - 1);
  } else if (s.winner != null) {
    // Winner lige fundet (eller playRoundOut er off) — gå tilbage til vinder selv
    prevIdx = s.winner;
    s.winner = null;
    s.turnsSinceWin = 0;
  } else {
    prevIdx = (s.currentPlayer - 1 + s.players.length) % s.players.length;
  }
  const player = s.players[prevIdx];
  const last = player.history.pop();
  if (!last) { toast('No turns to undo'); return; }
  if (!last.bust) {
    player.score += last.throw;
    player.totalThrown -= last.throw;
    player.highest = player.history.reduce((m, h) => h.bust ? m : Math.max(m, h.throw), 0);
  }
  s.currentPlayer = prevIdx;
  s.pendingDarts = [];
  s.multiplier = 1;
  _saveDart();
  renderDart();
}
function _dartNewGame() {
  if (!confirm('Start a new game? The current game will be lost.')) return;
  if (_dartState) _dartState.setupDone = false;
  _saveDart();
  renderDart();
}
window._dartSetMult = _dartSetMult;
window._dartHit = _dartHit;
window._dartHitBull = _dartHitBull;
window._dartUndoDart = _dartUndoDart;
window._dartFinishTurn = _dartFinishTurn;
window._dartUndo = _dartUndo;
window._dartNewGame = _dartNewGame;

// Vis fuld statistik-tabel som modal (åbnes fra 📊-knap i topbar)
function _dartShowStats() {
  const s = _dartState;
  if (!s || !s.players) return;
  const rows = s.players.map((p, i) => {
    const st = _dartStats(p);
    const c  = _DART_PALETTE[p.colorIdx || 0];
    return `<tr class="${i === s.currentPlayer ? 'is-current' : ''}" style="--p-color:${c.hex}">
      <td><b><span class="dart-stat-dot"></span>${esc(p.name)}</b></td>
      <td><b>${p.score}</b></td>
      <td>${st.avg3}</td><td>${st.avg1}</td><td>${st.first9Avg || '—'}</td>
      <td>${st.dartsThrown}</td>
      <td>${st.highest}</td>
      <td>${st.n180 || '—'}</td><td>${st.n140 || '—'}</td>
      <td>${st.n100 || '—'}</td><td>${st.busts || '—'}</td>
    </tr>`;
  }).join('');
  const html = `
    <div class="dart-stats-modal">
      <div class="dart-stats-modal-head">
        <div class="dart-stats-modal-title">📊 Game Statistics</div>
        <div class="dart-stats-modal-sub">Game ${s.gameNumber || 1} · ${s.startScore}${s.doubleOut ? ' · Double out' : ''}</div>
      </div>
      <div class="dart-winner-table-wrap">
        <table class="dart-winner-table">
          <thead>
            <tr><th>Player</th><th>Score</th><th>3-dart</th><th>1-dart</th><th>First 9</th><th>Darts</th><th>★</th><th>180</th><th>140+</th><th>100+</th><th>Bust</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="dart-stats-modal-foot">
        <button class="dart-tb-btn" onclick="closeModal()">Close</button>
      </div>
    </div>`;
  openModal(html, { wide: true });
}
window._dartShowStats = _dartShowStats;

function _renderDartWinner(ov) {
  const s = _dartState;
  ov.setAttribute('data-theme', s.theme || 'klassisk');
  const winner = s.players[s.winner];
  const winSt = _dartStats(winner);
  const winColor = _DART_PALETTE[winner.colorIdx || 0];
  const gameNum = s.gameNumber || 1;

  // Turnerings-standings sorteret efter point
  const tScores = (s.tournament && s.tournament.scores) || {};
  const standings = Object.entries(tScores)
    .map(([name, d]) => ({ name, ...d }))
    .sort((a, b) => b.points - a.points || b.wins - a.wins);

  ov.innerHTML = `
    <div class="dart-winner" style="--win-color:${winColor.hex}">
      <div class="dart-trophy">🏆</div>
      <div class="dart-winner-lbl">Winner of game ${gameNum}</div>
      <div class="dart-winner-name">${esc(winner.name)}</div>
      <div class="dart-winner-stats">
        <div><b>${winSt.avg3}</b><span>3-dart avg</span></div>
        <div><b>${winSt.avg1}</b><span>1-dart avg</span></div>
        <div><b>${winSt.dartsThrown}</b><span>darts thrown</span></div>
        <div><b>${winSt.highest}</b><span>highest turn</span></div>
      </div>

      ${standings.length ? `
        <div class="dart-standings-wrap">
          <div class="dart-standings-title">🏅 Tournament standings after game ${gameNum}</div>
          <div class="dart-standings">
            ${standings.map((row, place) => {
              const c = _DART_PALETTE[row.colorIdx || 0];
              const medal = ['🥇','🥈','🥉'][place] || `${place+1}.`;
              return `<div class="dart-stand-row" style="--p-color:${c.hex}">
                <div class="dart-stand-place">${medal}</div>
                <div class="dart-stand-name">${esc(row.name)}</div>
                <div class="dart-stand-meta">${row.wins} wins · ${row.games} games</div>
                <div class="dart-stand-pts"><b>${row.points}</b><span>points</span></div>
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}

      <details class="dart-game-stats-fold">
        <summary>Show game statistics</summary>
        <div class="dart-winner-table-wrap">
          <table class="dart-winner-table">
            <thead>
              <tr><th>Player</th><th>3-dart</th><th>1-dart</th><th>Darts</th><th>★</th><th>180</th><th>140+</th><th>100+</th><th>Bust</th></tr>
            </thead>
            <tbody>
              ${s.players.map((p, i) => {
                const st = _dartStats(p);
                return `<tr class="${i === s.winner ? 'is-winner' : ''}">
                  <td><b>${esc(p.name)}</b>${i === s.winner ? ' 🏆' : ''}</td>
                  <td>${st.avg3}</td><td>${st.avg1}</td><td>${st.dartsThrown}</td>
                  <td>${st.highest}</td>
                  <td>${st.n180 || '—'}</td><td>${st.n140 || '—'}</td>
                  <td>${st.n100 || '—'}</td><td>${st.busts || '—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </details>

      <div class="dart-winner-btns">
        <button class="dart-start-btn" onclick="_dartNextGame()">Next game →</button>
        <button class="dart-tb-btn" onclick="_dartEndTournament()">End tournament</button>
        <button class="dart-tb-btn" onclick="_dartUndo()">↶ Undo last turn</button>
      </div>
    </div>`;
}
function _dartRematch() {
  if (!_dartState) return;
  const names = _dartState.players.map(p => p.name);
  _dartState = _newDartGame(_dartState.startScore, names, _dartState.doubleOut);
  _saveDart();
  renderDart();
}
window._dartRematch = _dartRematch;

// ── Standalone-opstart ──
(function _dartStandaloneBoot() {
  const ov = $('dart-ov');
  if (!ov) return;
  ov.style.display = 'flex';
  renderDart();
})();
</script>
